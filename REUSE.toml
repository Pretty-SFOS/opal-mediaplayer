version = 1
SPDX-PackageName = "Opal.MediaPlayer"
SPDX-PackageSupplier = "Mirian Margiani <mixosaurus+ichthyo@pm.me>"
SPDX-PackageDownloadLocation = "https://github.com/Pretty-SFOS/opal-mediaplayer"

[[annotations]]
path = "**"
precedence = "aggregate"
SPDX-License-Identifier = "LicenseRef-NO-AI-1.0"

[[annotations]]
path = "translations/**"
precedence = "aggregate"
SPDX-FileCopyrightText = "Opal.MediaPlayer translations contributors"
SPDX-License-Identifier = "GPL-3.0-or-later"

[[annotations]]
path = "doc/screenshot-**.webp"
precedence = "aggregate"
SPDX-FileCopyrightText = "Mirian Margiani"
SPDX-License-Identifier = "CC-BY-SA-4.0"

[[annotations]]
path = ["icon-src/**.svg", "icon-src/audio.rawr"]
precedence = "aggregate"
SPDX-FileCopyrightText = "Mirian Margiani"
SPDX-License-Identifier = "CC-BY-SA-4.0"
SPDX-FileComment = "source files for icons"
